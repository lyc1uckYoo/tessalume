name: Release Tessalume

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install image build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify tag, project version, and changelog
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Invalid application release tag: ${{ github.ref_name }}"
          }
          $project = [xml](Get-Content -Raw 'src/Tessalume.App/Tessalume.App.csproj')
          $projectVersion = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($tagVersion -ne $projectVersion) {
            throw "Tag $tagVersion does not match project version $projectVersion."
          }
          .\tools\Get-ReleaseNotes.ps1 -Version $tagVersion -OutputPath 'artifacts/release-notes.md'

      - name: Build, test, and publish release
        shell: pwsh
        run: |
          dotnet restore Tessalume.sln
          dotnet format Tessalume.sln --verify-no-changes --no-restore --verbosity minimal
          .\一键构建EXE.ps1 -Configuration Release -Runtime win-x64 -NoLaunch -FullValidation

      - name: Build verified incremental update from previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $targetVersion = '${{ github.ref_name }}'.TrimStart('v')
          $releases = gh release list --limit 20 --exclude-drafts --exclude-pre-releases --json tagName,publishedAt |
            ConvertFrom-Json
          $previous = $releases |
            Where-Object {
              $_.tagName -ne '${{ github.ref_name }}' -and
              $_.tagName -match '^v\d+\.\d+\.\d+$'
            } |
            Sort-Object publishedAt -Descending |
            Select-Object -First 1
          if ($null -eq $previous) {
            Write-Host 'No previous stable release is available; publishing the full EXE only.'
            exit 0
          }

          $basisDirectory = 'artifacts/delta-basis'
          New-Item -ItemType Directory -Path $basisDirectory -Force | Out-Null
          gh release download $previous.tagName --pattern 'Tessalume.exe' --dir $basisDirectory --clobber
          .\tools\New-DeltaUpdatePack.ps1 `
            -BasisExecutable "$basisDirectory/Tessalume.exe" `
            -BasisVersion $previous.tagName `
            -TargetExecutable 'dist/portable-win-x64/Tessalume.exe' `
            -TargetVersion $targetVersion `
            -OutputDirectory 'dist/portable-win-x64'

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(
            'dist/portable-win-x64/Tessalume.exe',
            'dist/portable-win-x64/SHA256SUMS.txt',
            'THIRD-PARTY-NOTICES.md'
          )
          $manifest = 'dist/portable-win-x64/Tessalume.update.json'
          if (Test-Path -LiteralPath $manifest) {
            $assets += $manifest
            $assets += @(Get-ChildItem 'dist/portable-win-x64' -Filter '*.delta' -File |
              Select-Object -ExpandProperty FullName)
          }
          if (gh release view $tag 2>$null) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "Tessalume $tag" --notes-file 'artifacts/release-notes.md' --latest
          }
          else {
            gh release create $tag @assets --verify-tag --title "Tessalume $tag" --notes-file 'artifacts/release-notes.md' --latest
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tessalume-${{ github.ref_name }}-windows-x64
          path: |
            dist/portable-win-x64/Tessalume.exe
            dist/portable-win-x64/SHA256SUMS.txt
            dist/portable-win-x64/Tessalume.update.json
            dist/portable-win-x64/*.delta
            THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 30
